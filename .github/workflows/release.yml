name: Release Binaries

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (glibc)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: skill-cli
            archive_ext: tar.gz
            use_cross: false

          # Linux x86_64 (musl static)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: skill-cli
            archive_ext: tar.gz
            use_cross: true

          # Linux ARM64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: skill-cli
            archive_ext: tar.gz
            use_cross: true

          # macOS Apple Silicon (M1/M2/M3/M4)
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: skill-cli
            archive_ext: tar.gz
            use_cross: false

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: skill-cli.exe
            archive_ext: zip
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross if needed
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Build release binary (Standard)
        if: "!matrix.use_cross"
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Build release binary (Cross)
        if: matrix.use_cross
        run: |
          cross build --release --target ${{ matrix.target }}

      - name: Package Artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TAG="${{ github.ref_name || github.event.inputs.tag_name || 'v0.2.0' }}"
          ARCHIVE_NAME="skill-cli-${TAG}-${{ matrix.target }}"
          STAGE_DIR="stage/${ARCHIVE_NAME}"
          mkdir -p "${STAGE_DIR}"

          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${STAGE_DIR}/"
          cp README.md LICENSE NOTICE "${STAGE_DIR}/"

          tar -czf "${ARCHIVE_NAME}.tar.gz" -C stage "${ARCHIVE_NAME}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          fi

          echo "ASSET_ARCHIVE=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_ENV
          echo "ASSET_CHECKSUM=${ARCHIVE_NAME}.tar.gz.sha256" >> $GITHUB_ENV

      - name: Package Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $TAG = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } elseif ($env:INPUT_TAG_NAME) { $env:INPUT_TAG_NAME } else { "v0.2.0" }
          $ARCHIVE_NAME = "skill-cli-$TAG-${{ matrix.target }}"
          $STAGE_DIR = "stage/$ARCHIVE_NAME"
          New-Item -ItemType Directory -Force -Path $STAGE_DIR | Out-Null

          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination $STAGE_DIR/
          Copy-Item README.md, LICENSE, NOTICE -Destination $STAGE_DIR/

          Compress-Archive -Path $STAGE_DIR -DestinationPath "${ARCHIVE_NAME}.zip" -Force
          $hash = (Get-FileHash -Path "${ARCHIVE_NAME}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${ARCHIVE_NAME}.zip" | Out-File -FilePath "${ARCHIVE_NAME}.zip.sha256" -Encoding ascii

          echo "ASSET_ARCHIVE=${ARCHIVE_NAME}.zip" >> $env:GITHUB_ENV
          echo "ASSET_CHECKSUM=${ARCHIVE_NAME}.zip.sha256" >> $env:GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ env.ASSET_ARCHIVE }}
            ${{ env.ASSET_CHECKSUM }}

  publish-release:
    name: Publish GitHub Release
    needs: [build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Files
        run: |
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          name: ${{ github.ref_name || github.event.inputs.tag_name }} — High-Performance AI Agent Skill Engine
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/*
