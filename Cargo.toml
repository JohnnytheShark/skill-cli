[package]
name = "skill-cli"
version = "0.1.0"
edition = "2024"
authors = ["Johnny Orellana"]
license = "Apache-2.0"
description = "A high-performance AI Agent Skill Engine — CLI + MCP server backed by SQLite FTS5"
repository = "https://github.com/JohnnytheShark/skill-cli"
readme = "README.md"
keywords = ["mcp", "ai", "agent", "sqlite", "cli"]
categories = ["command-line-utilities", "database"]

[dependencies]
rusqlite = { version = "0.31", features = ["bundled", "bundled-full"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# serde_yaml 0.9.x is deprecated upstream; use the maintained fork via serde_yml
serde_yml = "0.0.12"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
