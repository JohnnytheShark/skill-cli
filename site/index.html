<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="skill-cli — High-Performance, Zero-Config AI Agent Skill Engine in Rust with SQLite FTS5 search and Model Context Protocol (MCP) server.">
  <meta name="theme-color" content="#080c14">

  <title>skill-cli — High-Performance AI Agent Skill Engine</title>

  <!-- Google Fonts: Plus Jakarta Sans, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Modular Design System Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Ambient background glow mesh -->
  <div class="bg-glow-mesh"></div>
  <div class="bg-grid-overlay"></div>

  <!-- Top Navigation Mount Point -->
  <header id="navbar-mount"></header>

  <!-- Main Content Layout -->
  <main>
    <!-- Hero Section Mount Point (includes Terminal Simulator) -->
    <div id="hero-mount"></div>

    <!-- Architecture & Core Capabilities Mount Point -->
    <div id="features-mount"></div>

    <!-- Diataxis Documentation Suite Mount Point (Matrix & Explorer) -->
    <div id="diataxis-viewer-mount"></div>

    <!-- MCP Interactive Playground Sandbox Mount Point -->
    <div id="playground-mount"></div>

    <!-- Precompiled Binary Downloads Mount Point -->
    <div id="downloads-mount"></div>
  </main>

  <!-- Global Modal Mount Points -->
  <div id="search-modal-mount"></div>
  <div id="global-toast" class="toast-msg"></div>

  <!-- Site Footer Mount Point -->
  <footer id="footer-mount"></footer>

  <!-- Application Entrypoint (ES Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
