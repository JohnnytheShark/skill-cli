<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="skill-cli — The high-performance, single-binary Rust AI agent skill engine with SQLite FTS5 search and native Model Context Protocol (MCP) server.">
  <meta name="theme-color" content="#12130F">

  <title>skill-cli — High-Performance Rust AI Agent Skill Engine</title>

  <!-- Google Fonts: Space Grotesk (Headlines), Plus Jakarta Sans (Body), JetBrains Mono (Code) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Modular Design System Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Ambient organic substrate layers -->
  <div class="bg-substrate"></div>
  <div class="bg-grid-substrate"></div>

  <!-- Top Navigation Mount Point -->
  <header id="navbar-mount"></header>

  <!-- Main Content Layout -->
  <main id="main-content">
    <!-- Hero Section Mount Point (includes Strata Terminal Simulator) -->
    <div id="hero-mount"></div>

    <!-- Architecture & Core Capabilities Mount Point -->
    <div id="features-mount"></div>

    <!-- Diataxis Documentation Suite Mount Point (Matrix & Explorer) -->
    <div id="diataxis-viewer-mount"></div>

    <!-- MCP Interactive Playground Sandbox Mount Point -->
    <div id="playground-mount"></div>

    <!-- Precompiled Binary Downloads Mount Point -->
    <div id="downloads-mount"></div>
  </main>

  <!-- Global Modal Mount Points -->
  <div id="search-modal-mount"></div>
  <div id="global-toast" class="toast-msg"></div>

  <!-- Site Footer Mount Point -->
  <footer id="footer-mount"></footer>

  <!-- Application Entrypoint (ES Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
